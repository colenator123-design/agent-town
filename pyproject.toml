[project]
name = "pikachu-desktop-agent"
version = "0.1.0"
description = "A local-first desktop companion with a UI-independent agent core"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=11,<13",
  "Send2Trash>=1.8,<2",
  "ytmusicapi>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ai = ["openai>=2,<3"]

[project.scripts]
pikachu-agent = "pikachu_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pikachu_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
